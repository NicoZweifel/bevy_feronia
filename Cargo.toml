[package]
name = "bevy_feronia"
version = "0.4.6"

edition = "2024"
description = "Foliage/grass scattering tools and wind simulation shaders/materials that prioritize visual fidelity/artistic freedom, a declarative api and modularity."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NicoZweifel/bevy_feronia"

exclude = ["assets/", ".github/"]

[dependencies]
bevy = { version = "0.17", default-features = false, features = [
    "bevy_pbr", "bevy_state",
    "bevy_log",
    "bevy_gizmos"
] }
bevy-inspector-egui = "0.35.0"
bytemuck = "1.23.1"
noise = "0.9.0"
bitflags = "2.9.1"
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
xxh3 = "0.1.1"
rand_pcg = "0.9.0"

[dev-dependencies]
bevy = { version = "0.17", features = ["dynamic_linking", "file_watcher", "jpeg", "embedded_watcher", "asset_processor", "basis-universal", "mp3"] }

bytemuck = "1.23.1"
iyes_perf_ui = "0.5.0"
# Set max log levels. This helps avoid unwanted low-severity log spam, which can affect performance.
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
noise = "0.9.0"
tracing = { version = "0.1", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

[features]
default = []

# Enables the "dlss" feature in the bevy crate. Used only in examples.
dlss = ["bevy/dlss"]

[patch.crates-io]
iyes_perf_ui = { git = "https://github.com/mgi388/iyes_perf_ui", branch = "bevy-0.17" }