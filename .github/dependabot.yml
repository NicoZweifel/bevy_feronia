version: 2
updates:
  # actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      bevy:
        patterns:
          - "bevy"
          - "bevy_*"
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # crates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"

